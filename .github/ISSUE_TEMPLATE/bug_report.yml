name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private process in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Interview (voice, transcript, reconnect)
        - Repository analysis
        - Reports
        - Edge Functions / API
        - Database / migrations
        - Evals / load tests
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Browser and OS, and whether this is local development or the hosted app.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any tokens, keys or personal data before pasting.
      render: text
