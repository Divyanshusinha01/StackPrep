services:
  - type: web
    name: stackprep-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --filter "@stackprep/api..." && pnpm --filter @stackprep/api build
    startCommand: pnpm --filter @stackprep/api start
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false

  # Render background workers require a paid instance type.
  - type: worker
    name: stackprep-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false --filter "@stackprep/worker..." && pnpm --filter @stackprep/worker build
    startCommand: pnpm --filter @stackprep/worker start
    buildFilter:
      paths:
        - apps/worker/**
        - packages/shared/**
        - pnpm-lock.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
