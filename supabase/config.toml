project_id = "stackprep"

[db]
major_version = 17

# Vector cannot reach the Docker daemon on Docker Desktop for Windows (tcp 2375), so it crash-loops.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = true

# User sign-in only (Supabase Auth + a GitHub OAuth App). Repository access goes through the
# separate GitHub App; no provider token from this login is used to read repositories.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""

[functions.health]
enabled = true
verify_jwt = false
entrypoint = "./functions/health/index.ts"

[functions.me]
enabled = true
verify_jwt = true
entrypoint = "./functions/me/index.ts"

[functions.github]
enabled = true
verify_jwt = true
entrypoint = "./functions/github/index.ts"

[functions.repositories]
enabled = true
verify_jwt = true
entrypoint = "./functions/repositories/index.ts"

[functions.workspaces]
enabled = true
verify_jwt = true
entrypoint = "./functions/workspaces/index.ts"

[functions.interviews]
enabled = true
verify_jwt = true
entrypoint = "./functions/interviews/index.ts"

# Called by Inngest, not browsers: requests are authenticated with the Inngest signing key.
[functions.inngest]
enabled = true
verify_jwt = false
entrypoint = "./functions/inngest/index.ts"
# Tree-sitter runtime and grammars read by @stackprep/code-parser at run time.
static_files = ["../packages/code-parser/grammars/*.wasm"]
